name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      REQUIRE_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --locked python -m playwright install --with-deps firefox
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv lock --check --offline
      - run: uv run --locked python run_friend.py --help
      - run: uv run --locked python -m group_friend --help
      - run: uv run --locked group-friend --help
